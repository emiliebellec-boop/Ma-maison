<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><title>Ma Maison</title><style>
:root{--bg:#fff4fb;--card:#fff;--ink:#322b45;--muted:#786f89;--accent:#8b5cf6;--accent2:#eee7ff;--line:#eadff1;--danger:#d94b78;--shadow:0 10px 28px rgba(99,72,130,.12);--pink:#ff78ad;--yellow:#ffd86b;--mint:#77d9bd;--blue:#72b8ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff4fb,#f5f4ff 55%,#effaff);min-height:100vh}header{padding:24px 18px 12px;max-width:850px;margin:auto}h1{margin:0;font-size:34px}header p{margin:7px 0;color:var(--muted);font-weight:600}nav{position:sticky;top:0;z-index:3;background:rgba(255,247,252,.9);backdrop-filter:blur(14px);display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid #eadff1}nav button{border:0;background:#fff;padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:800;color:var(--muted);box-shadow:0 3px 10px rgba(80,50,110,.07)}nav button.active{background:linear-gradient(135deg,var(--pink),var(--accent));color:#fff}main{max-width:850px;margin:auto;padding:16px 14px 90px}.panel{display:none}.panel.active{display:block}.card{background:rgba(255,255,255,.96);border:1px solid rgba(139,92,246,.13);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.progress{height:13px;background:#eee9f5;border-radius:99px;overflow:hidden;margin-top:13px}.progress>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--accent),var(--blue));width:0}.task{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border-left:6px solid var(--mint)}.task:nth-child(4n+1){border-left-color:var(--pink)}.task:nth-child(4n+2){border-left-color:var(--mint)}.task:nth-child(4n+3){border-left-color:var(--yellow)}.task:nth-child(4n){border-left-color:var(--blue)}.task input{width:23px;height:23px;accent-color:var(--accent);margin-top:1px}.task.done{opacity:.68}.task.done .txt{text-decoration:line-through;color:#999}.txt{flex:1}.txt small{display:block;color:var(--muted);margin-top:5px;font-weight:600}.tag{font-size:12px;background:var(--accent2);padding:4px 8px;border-radius:99px;color:#6346a5}.overdue{background:#ffe0e9;color:#a43b61}.actions button,.primary,.ghost,.danger{border:0;border-radius:13px;padding:10px 12px;font-weight:800}.primary{background:linear-gradient(135deg,var(--pink),var(--accent));color:#fff}.ghost{background:#f1ebff;color:#60439a}.danger{background:#ffe1ea;color:var(--danger)}.actions{display:flex;gap:6px}.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:10px 3px;border-radius:14px;background:#fff;text-align:center;font-size:12px;box-shadow:0 4px 12px rgba(80,50,110,.06)}.day.today{background:linear-gradient(145deg,var(--pink),var(--accent));color:#fff}.day b{display:block;font-size:16px}.section-title{margin:22px 3px 10px;font-size:19px}.empty{text-align:center;color:var(--muted);padding:28px 8px}form{display:grid;gap:10px}input[type=text],select,input[type=date]{width:100%;border:2px solid #eee5f5;background:#fff;border-radius:14px;padding:12px;font-size:16px;color:var(--ink)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:13px;color:var(--muted)}.week-select{display:flex;gap:8px;overflow:auto;padding:8px 0 3px}.week-select button{min-width:48px;border:0;border-radius:13px;padding:11px;background:#f0eaff;color:#6748a4;font-weight:800}.week-select button.active{background:linear-gradient(135deg,var(--pink),var(--accent));color:#fff}.celebrate{padding:14px;margin:12px 0 16px;border-radius:18px;text-align:center;font-weight:800;background:linear-gradient(135deg,#ffe0ef,#eee7ff,#dff8f0);box-shadow:var(--shadow)}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}h3{color:#634b82}@media(max-width:520px){.weekgrid{gap:3px}.day{font-size:10px}.day b{font-size:14px}.two{grid-template-columns:1fr}h1{font-size:32px}}
</style></head><body><header><h1>🌈 Ma Maison ✨</h1><p id="dateLabel"></p></header><nav id="nav"><button data-tab="today" class="active">☀️ Aujourd’hui</button><button data-tab="week">📅 Semaine</button><button data-tab="routines">🔁 Routines</button><button data-tab="declutter">📦 Désencombrement</button></nav><main>
<section id="today" class="panel active"><div class="card"><div class="row between"><div><b>Progression du jour</b><div class="note" id="progressText"></div></div><button class="ghost" id="resetToday">Réinitialiser</button></div><div class="progress"><div id="progressBar"></div></div></div><div id="celebrate"></div><div id="todayTasks"></div></section>
<section id="week" class="panel"><div class="weekgrid" id="weekGrid"></div><h2 class="section-title">Cette semaine</h2><div id="weekTasks"></div></section>
<section id="routines" class="panel"><div class="card"><h2 style="margin-top:0">Ajouter une tâche</h2><form id="addForm"><input id="taskName" type="text" placeholder="Ex. Nettoyer le frigo" required><div class="two"><select id="taskCategory"><option>Ménage</option><option>Lessive</option><option>Maison</option><option>Autre</option></select><select id="taskFrequency"><option value="once">Une fois</option><option value="daily">Tous les jours</option><option value="weekly">Chaque semaine</option></select></div><select id="taskDay"><option value="0">Dimanche</option><option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option><option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option></select><button class="primary" type="submit">Ajouter</button></form></div><h2 class="section-title">Mes routines</h2><div id="routineList"></div></section>
<section id="declutter" class="panel"><div class="card"><div class="row between"><div><b>Programme sur 6 semaines</b><div class="note">Choisis la semaine en cours. Elle est mémorisée.</div></div></div><div class="week-select" id="weekSelect"></div></div><div id="declutterList"></div></section>
<div class="footer-note">Les données sont enregistrées sur cet appareil dans Safari.</div></main><script>
const DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const base=[
['Rangement express + litières (ramassage)','Maison','daily'],['Vaisselle / cuisine remise à zéro','Ménage','daily'],
['Nettoyage complet des litières','Maison','weekly',1],['Sortir les poubelles noires','Maison','weekly',1],['Chambres : rangement, poussière, aspirateur','Ménage','weekly',1],['Aspirateur couloirs + escaliers','Ménage','weekly',1],['Lessive vêtements','Lessive','weekly',1],
['Cuisine : plaques, évier, crédence, plan de travail + sol','Ménage','weekly',2],
['Salle de bain + WC complet','Ménage','weekly',3],['Serviettes + tapis de bain','Lessive','weekly',3],
['Salon + entrée : rangement, poussière, canapé + aspirateur','Ménage','weekly',4],
['Aspirateur toute la maison + couloirs + escaliers','Ménage','weekly',5],['Lavage des sols','Ménage','weekly',5],
['Torchons + lavettes','Lessive','weekly',6],['Ménage approfondi en rotation','Ménage','weekly',6],
['Sortir les poubelles de recyclage','Maison','weekly',0]
].map((x,i)=>({id:'b'+i,name:x[0],cat:x[1],freq:x[2],day:x[3]}));
const declutter={1:['Entrée + chaussures sous escalier','Kallax 8 : papiers administratifs','Kallax 8 : papeterie','Kallax 8 : verres + autres cases','Meuble TV haut','Meuble TV bas : DVD + consoles','Kallax 4 + table basse'],2:['Tiroirs cuisine 1–2','Tiroirs cuisine 3–4','Tiroirs cuisine 5–6','Placards hauts','Placard bas + sous-évier','Grande étagère au-dessus du four/frigo','Vérification + évacuation des dons'],3:['Penderie chambre 1','Étagères chambre 1','Commode : moitié 1','Commode : moitié 2','Chaussures / accessoires','Dessus et dessous des meubles','Finition + sacs de dons'],4:['Chambre 2 : bureau','Chambre 2 : clic-clac + autour','Salle de bain : produits / stock','Chambre 3 : première zone','Chambre 3 : deuxième zone','Objets restants des chambres','Finitions + dons'],5:['2e étage : zone 1','2e étage : zone 2','2e étage : zone 3','2e étage : zone 4','Objets stockés « au cas où »','Gros tri / objets volumineux','Réorganisation finale'],6:['Garage : placard haut 1','Garage : placard haut 2','Garage : grande étagère 1','Garage : grande étagère 2','Garage : grande étagère 3','Garage : 2 meubles à étagères ouvertes','Garage : volumineux + sol + organisation finale']};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let custom=load('mm_custom',[]),done=load('mm_done',{}),currentWeek=load('mm_declutter_week',1);const iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};const today=new Date();document.getElementById('dateLabel').textContent=today.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function key(task,date){return iso(date)+'|'+task.id}function startOfDay(d){let x=new Date(d);x.setHours(0,0,0,0);return x}
function previousDays(n=14){let out=[];for(let i=1;i<=n;i++){let d=startOfDay(today);d.setDate(d.getDate()-i);out.push(d)}return out}
function overdueTasks(){let seen=new Set(),out=[];for(const d of previousDays(14)){for(const t of tasksFor(d)){const k=key(t,d);if(!done[k]&&!seen.has(t.id)){seen.add(t.id);out.push({t,date:d,k})}}}return out}
function tasksFor(date){return [...base,...custom].filter(t=>t.freq==='daily'||(t.freq==='weekly'&&t.day===date.getDay())||(t.freq==='once'&&t.date===iso(date)))}function taskHTML(t,date,allow=true){let k=key(t,date),ck=!!done[k];return `<div class="card task ${ck?'done':''}"><input type="checkbox" ${ck?'checked':''} onchange="toggleDone('${k}')"><div class="txt"><b>${esc(t.name)}</b><small>${esc(t.cat||'Tâche')} · ${t.freq==='daily'?'quotidien':t.freq==='weekly'?DAYS[t.day]:'ponctuel'}</small></div>${allow&&t.custom?`<div class="actions"><button class="danger" onclick="removeTask('${t.id}')">✕</button></div>`:''}</div>`}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}window.toggleDone=k=>{done[k]=!done[k];save('mm_done',done);render()};window.removeTask=id=>{custom=custom.filter(t=>t.id!==id);save('mm_custom',custom);render()};
function renderToday(){
let ts=tasksFor(today),late=overdueTasks(),el=document.getElementById('todayTasks'),blocks='';
if(late.length){blocks+='<h2 class="section-title">⏰ En retard</h2>'+late.map(x=>`<div class="card task"><input type="checkbox" onchange="toggleDone('${x.k}')"><div class="txt"><b>${esc(x.t.name)}</b><small>${esc(x.t.cat||'Tâche')} · prévu ${x.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})}</small></div><span class="tag overdue">En retard</span></div>`).join('')+'<h2 class="section-title">☀️ Aujourd’hui</h2>'}
blocks+=ts.length?ts.map(t=>taskHTML(t,today)).join(''):'<div class="empty">Rien de prévu aujourd’hui 🎉</div>';el.innerHTML=blocks;
let n=ts.filter(t=>done[key(t,today)]).length+late.filter(x=>done[x.k]).length,total=ts.length+late.length,p=total?Math.round(n/total*100):100;
document.getElementById('progressText').textContent=`${n}/${total} tâches • ${p} %`;document.getElementById('progressBar').style.width=p+'%';
document.getElementById('celebrate').innerHTML=(total>0&&n===total)?'<div class="celebrate">🎉 Bravo ! Tout est fait pour aujourd’hui ✨</div>':'';
}
function mondayOf(d){let x=new Date(d),day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));x.setHours(0,0,0,0);return x}function renderWeek(){let mon=mondayOf(today),grid='',all='';for(let i=0;i<7;i++){let d=new Date(mon);d.setDate(mon.getDate()+i);grid+=`<div class="day ${iso(d)===iso(today)?'today':''}"><b>${d.getDate()}</b>${DAYS[d.getDay()].slice(0,3)}</div>`;let ts=tasksFor(d);if(ts.length)all+=`<h3>${DAYS[d.getDay()]} ${d.getDate()}</h3>`+ts.map(t=>taskHTML(t,d)).join('')}document.getElementById('weekGrid').innerHTML=grid;document.getElementById('weekTasks').innerHTML=all}
function renderRoutines(){let all=[...base,...custom];document.getElementById('routineList').innerHTML=all.map(t=>taskHTML(t,today,!!t.custom)).join('')}
function renderDeclutter(){let ws='';for(let i=1;i<=6;i++)ws+=`<button class="${i===currentWeek?'active':''}" onclick="setWeek(${i})">S${i}</button>`;document.getElementById('weekSelect').innerHTML=ws;let mon=mondayOf(today);document.getElementById('declutterList').innerHTML=declutter[currentWeek].map((name,i)=>{let d=new Date(mon);d.setDate(mon.getDate()+i);let t={id:'d'+currentWeek+'-'+i,name,cat:'Désencombrement',freq:'once',date:iso(d)};return `<h3>${DAYS[d.getDay()]}</h3>`+taskHTML(t,d,false)}).join('')}window.setWeek=n=>{currentWeek=n;save('mm_declutter_week',n);renderDeclutter()};function render(){renderToday();renderWeek();renderRoutines();renderDeclutter()}render();
document.getElementById('nav').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(e.target.dataset.tab).classList.add('active')};document.getElementById('resetToday').onclick=()=>{tasksFor(today).forEach(t=>delete done[key(t,today)]);save('mm_done',done);render()};document.getElementById('taskFrequency').onchange=e=>document.getElementById('taskDay').style.display=e.target.value==='weekly'?'block':'none';document.getElementById('addForm').onsubmit=e=>{e.preventDefault();let freq=document.getElementById('taskFrequency').value;custom.push({id:'c'+Date.now(),name:document.getElementById('taskName').value.trim(),cat:document.getElementById('taskCategory').value,freq,day:+document.getElementById('taskDay').value,date:freq==='once'?iso(today):undefined,custom:true});save('mm_custom',custom);e.target.reset();render()};
</script></body></html>
